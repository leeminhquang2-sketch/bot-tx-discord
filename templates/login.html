<!-- bot/templates/login.html -->
<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Đăng nhập - Game MQ Admin</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
        }
        
        .login-container {
            width: 100%;
            max-width: 420px;
            padding: 20px;
        }
        
        .login-box {
            background: white;
            border-radius: 16px;
            padding: 40px;
            box-shadow: 0 20px 60px rgba(0,0,0,0.3);
        }
        
        .login-header {
            text-align: center;
            margin-bottom: 32px;
        }
        
        .login-header .logo {
            font-size: 48px;
            margin-bottom: 8px;
        }
        
        .login-header h2 {
            font-size: 24px;
            color: #2d3748;
            margin-bottom: 4px;
        }
        
        .login-header p {
            color: #718096;
            font-size: 14px;
        }
        
        .form-group {
            margin-bottom: 20px;
        }
        
        .form-group label {
            display: block;
            margin-bottom: 6px;
            font-weight: 600;
            color: #4a5568;
            font-size: 14px;
        }
        
        .form-group input {
            width: 100%;
            padding: 12px 16px;
            border: 2px solid #e2e8f0;
            border-radius: 8px;
            font-size: 16px;
            transition: border-color 0.3s;
        }
        
        .form-group input:focus {
            outline: none;
            border-color: #667eea;
        }
        
        .form-group .hint {
            font-size: 12px;
            color: #a0aec0;
            margin-top: 4px;
        }
        
        .btn-primary {
            width: 100%;
            padding: 14px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: transform 0.2s, box-shadow 0.2s;
        }
        
        .btn-primary:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 25px rgba(102, 126, 234, 0.4);
        }
        
        .btn-primary:active {
            transform: translateY(0);
        }
        
        .error-message {
            background: #fff5f5;
            color: #9b2c2c;
            padding: 12px;
            border-radius: 8px;
            margin-top: 16px;
            text-align: center;
            border: 1px solid #feb2b2;
        }
        
        .login-footer {
            margin-top: 24px;
            text-align: center;
            font-size: 14px;
            color: #a0aec0;
        }
        
        .server-status {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            padding: 10px;
            background: #f7fafc;
            border-radius: 8px;
            margin-bottom: 20px;
            font-size: 14px;
        }
        
        .status-dot {
            width: 10px;
            height: 10px;
            border-radius: 50%;
            display: inline-block;
        }
        
        .status-dot.online {
            background: #48bb78;
        }
        
        .status-dot.offline {
            background: #fc8181;
        }
        
        .hidden {
            display: none !important;
        }
        
        @media (max-width: 480px) {
            .login-box {
                padding: 24px;
            }
        }
    </style>
</head>
<body>
    <div class="login-container">
        <div class="login-box">
            <div class="login-header">
                <div class="logo">🎮</div>
                <h2>Game MQ Admin</h2>
                <p>Quản lý hệ thống game</p>
            </div>
            
            <div class="server-status" id="serverStatus">
                <span class="status-dot online" id="statusDot"></span>
                <span id="statusText">Đang kết nối...</span>
            </div>
            
            <form method="POST" action="/login">
                <div class="form-group">
                    <label for="key">🔑 Key truy cập</label>
                    <input type="password" id="key" name="key" placeholder="Nhập key truy cập" required autofocus>
                    <div class="hint">Key được cấp khi cài đặt hệ thống</div>
                </div>
                
                <div class="form-group">
                    <label for="password">🔒 Mật khẩu Admin</label>
                    <input type="password" id="password" name="password" placeholder="Nhập mật khẩu admin" required>
                </div>
                
                <button type="submit" class="btn-primary">Đăng nhập</button>
                
                {% if error %}
                <div class="error-message">{{ error }}</div>
                {% endif %}
            </form>
            
            <div class="login-footer">
                <p>🔐 Kết nối bảo mật • v1.0</p>
            </div>
        </div>
    </div>
    
    <script>
        // Kiểm tra kết nối server
        async function checkServer() {
            const dot = document.getElementById('statusDot');
            const text = document.getElementById('statusText');
            
            try {
                const response = await fetch('/api/health');
                if (response.ok) {
                    dot.className = 'status-dot online';
                    text.textContent = '✅ Server đang hoạt động';
                } else {
                    dot.className = 'status-dot offline';
                    text.textContent = '⚠️ Server đang offline';
                }
            } catch (error) {
                dot.className = 'status-dot offline';
                text.textContent = '❌ Không thể kết nối server';
            }
        }
        
        // Kiểm tra khi load trang
        checkServer();
        // Kiểm tra mỗi 10 giây
        setInterval(checkServer, 10000);
    </script>
</body>
</html>
