<!-- bot/templates/dashboard.html -->
<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard - Game MQ Admin</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        :root {
            --primary: #667eea;
            --secondary: #764ba2;
            --success: #48bb78;
            --danger: #fc8181;
            --gray-100: #f7fafc;
            --gray-200: #edf2f7;
            --gray-300: #e2e8f0;
            --gray-400: #cbd5e0;
            --gray-500: #a0aec0;
            --gray-600: #718096;
            --gray-700: #4a5568;
            --gray-800: #2d3748;
            --gray-900: #1a202c;
        }
        
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: var(--gray-100);
            color: var(--gray-800);
        }
        
        .app-container {
            display: flex;
            min-height: 100vh;
        }
        
        /* Sidebar */
        .sidebar {
            width: 260px;
            background: var(--gray-900);
            color: white;
            display: flex;
            flex-direction: column;
            position: fixed;
            height: 100vh;
            overflow-y: auto;
        }
        
        .sidebar-header {
            padding: 24px;
            border-bottom: 1px solid rgba(255,255,255,0.1);
        }
        
        .sidebar-header h2 {
            font-size: 24px;
        }
        
        .sidebar-header p {
            font-size: 14px;
            color: var(--gray-400);
        }
        
        .sidebar-nav {
            flex: 1;
            padding: 16px 0;
        }
        
        .sidebar-nav a {
            display: flex;
            align-items: center;
            padding: 12px 24px;
            color: var(--gray-300);
            text-decoration: none;
            transition: all 0.3s;
            border-left: 3px solid transparent;
        }
        
        .sidebar-nav a:hover {
            background: rgba(255,255,255,0.05);
            color: white;
        }
        
        .sidebar-nav a.active {
            background: rgba(102, 126, 234, 0.2);
            color: white;
            border-left-color: var(--primary);
        }
        
        .sidebar-nav a i {
            width: 24px;
            margin-right: 12px;
        }
        
        .sidebar-footer {
            padding: 16px 24px;
            border-top: 1px solid rgba(255,255,255,0.1);
        }
        
        .btn-logout {
            width: 100%;
            padding: 10px;
            background: rgba(255,255,255,0.05);
            color: var(--gray-300);
            border: 1px solid rgba(255,255,255,0.1);
            border-radius: 8px;
            cursor: pointer;
            transition: all 0.3s;
            font-size: 14px;
        }
        
        .btn-logout:hover {
            background: rgba(252, 129, 129, 0.2);
            color: var(--danger);
        }
        
        /* Main Content */
        .main-content {
            flex: 1;
            margin-left: 260px;
            padding: 24px;
        }
        
        .top-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 32px;
            padding: 20px;
            background: white;
            border-radius: 12px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.05);
        }
        
        .header-left h1 {
            font-size: 24px;
        }
        
        .header-left span {
            color: var(--gray-500);
            font-size: 14px;
        }
        
        .admin-badge {
            background: var(--primary);
            color: white;
            padding: 6px 16px;
            border-radius: 20px;
            font-size: 14px;
        }
        
        /* Stats Grid */
        .stats-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 20px;
            margin-bottom: 32px;
        }
        
        .stat-card {
            background: white;
            padding: 24px;
            border-radius: 12px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.05);
            transition: transform 0.2s;
        }
        
        .stat-card:hover {
            transform: translateY(-4px);
        }
        
        .stat-card .icon {
            font-size: 32px;
            margin-bottom: 8px;
        }
        
        .stat-card h3 {
            font-size: 14px;
            color: var(--gray-500);
            margin-bottom: 4px;
        }
        
        .stat-card p {
            font-size: 24px;
            font-weight: bold;
        }
        
        /* Cards */
        .card {
            background: white;
            border-radius: 12px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.05);
            margin-bottom: 32px;
            overflow: hidden;
        }
        
        .card-header {
            padding: 20px 24px;
            border-bottom: 1px solid var(--gray-200);
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        
        .card-header h2 {
            font-size: 18px;
            display: flex;
            align-items: center;
            gap: 8px;
        }
        
        .card-body {
            padding: 24px;
        }
        
        /* Form */
        .add-money-form {
            display: flex;
            flex-wrap: wrap;
            gap: 16px;
            align-items: flex-end;
        }
        
        .add-money-form .form-group {
            flex: 1;
            min-width: 150px;
        }
        
        .add-money-form .form-group label {
            display: block;
            margin-bottom: 4px;
            font-size: 14px;
            font-weight: 600;
            color: var(--gray-700);
        }
        
        .add-money-form .form-group input {
            width: 100%;
            padding: 10px 12px;
            border: 2px solid var(--gray-200);
            border-radius: 8px;
            font-size: 14px;
        }
        
        .add-money-form .form-group input:focus {
            outline: none;
            border-color: var(--primary);
        }
        
        .btn-primary {
            padding: 10px 24px;
            background: linear-gradient(135deg, var(--primary), var(--secondary));
            color: white;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            font-weight: 600;
            transition: all 0.3s;
        }
        
        .btn-primary:hover {
            transform: translateY(-2px);
            box-shadow: 0 4px 12px rgba(102, 126, 234, 0.4);
        }
        
        .btn-small {
            padding: 4px 12px;
            background: var(--primary);
            color: white;
            border: none;
            border-radius: 4px;
            font-size: 12px;
            cursor: pointer;
        }
        
        .result-message {
            margin-top: 16px;
            padding: 12px;
            border-radius: 8px;
        }
        
        .result-message.success {
            background: #f0fff4;
            color: #22543d;
            border: 1px solid #c6f6d5;
        }
        
        .result-message.error {
            background: #fff5f5;
            color: #9b2c2c;
            border: 1px solid #feb2b2;
        }
        
        /* Table */
        .table-responsive {
            overflow-x: auto;
        }
        
        table {
            width: 100%;
            border-collapse: collapse;
        }
        
        thead {
            background: var(--gray-50);
        }
        
        th {
            padding: 12px 16px;
            text-align: left;
            font-weight: 600;
            color: var(--gray-600);
            border-bottom: 2px solid var(--gray-200);
        }
        
        td {
            padding: 12px 16px;
            border-bottom: 1px solid var(--gray-100);
        }
        
        tbody tr:hover {
            background: var(--gray-50);
        }
        
        .search-box {
            position: relative;
        }
        
        .search-box input {
            padding: 8px 16px 8px 40px;
            border: 2px solid var(--gray-200);
            border-radius: 8px;
            font-size: 14px;
            width: 250px;
        }
        
        .search-box i {
            position: absolute;
            left: 14px;
            top: 50%;
            transform: translateY(-50%);
            color: var(--gray-400);
        }
        
        .loading-text {
            text-align: center;
            padding: 40px;
            color: var(--gray-500);
        }
        
        .hidden {
            display: none !important;
        }
        
        /* Responsive */
        @media (max-width: 768px) {
            .sidebar {
                width: 60px;
            }
            .sidebar-header h2, .sidebar-header p, .sidebar-nav a span {
                display: none;
            }
            .sidebar-nav a {
                padding: 12px;
                justify-content: center;
            }
            .sidebar-nav a i {
                margin-right: 0;
                font-size: 20px;
            }
            .main-content {
                margin-left: 60px;
                padding: 16px;
            }
            .stats-grid {
                grid-template-columns: 1fr 1fr;
            }
            .add-money-form {
                flex-direction: column;
            }
            .add-money-form .form-group {
                min-width: 100%;
            }
            .add-money-form .btn-primary {
                width: 100%;
            }
        }
        
        @media (max-width: 480px) {
            .stats-grid {
                grid-template-columns: 1fr;
            }
            .top-header {
                flex-direction: column;
                gap: 12px;
                text-align: center;
            }
            .search-box input {
                width: 100%;
            }
        }
    </style>
</head>
<body>
    <div class="app-container">
        <!-- Sidebar -->
        <aside class="sidebar">
            <div class="sidebar-header">
                <h2>🎮 Game MQ</h2>
                <p>Admin Panel</p>
            </div>
            <nav class="sidebar-nav">
                <a href="#" class="active" data-page="dashboard">
                    <i class="fas fa-home"></i> <span>Tổng quan</span>
                </a>
                <a href="#" data-page="players">
                    <i class="fas fa-users"></i> <span>Người chơi</span>
                </a>
                <a href="#" data-page="transactions">
                    <i class="fas fa-history"></i> <span>Giao dịch</span>
                </a>
            </nav>
            <div class="sidebar-footer">
                <a href="/logout" class="btn-logout">
                    <i class="fas fa-sign-out-alt"></i> Đăng xuất
                </a>
            </div>
        </aside>

        <!-- Main Content -->
        <main class="main-content">
            <header class="top-header">
                <div class="header-left">
                    <h1>📊 Tổng quan</h1>
                    <span id="currentTime"></span>
                </div>
                <div class="header-right">
                    <span class="admin-badge">👤 Admin</span>
                </div>
            </header>

            <!-- Stats -->
            <div class="stats-grid" id="statsGrid">
                <div class="stat-card">
                    <div class="icon">👥</div>
                    <h3>Tổng người chơi</h3>
                    <p id="totalUsers">0</p>
                </div>
                <div class="stat-card">
                    <div class="icon">💰</div>
                    <h3>Tổng số dư</h3>
                    <p id="totalBalance">0 MQ</p>
                </div>
                <div class="stat-card">
                    <div class="icon">🎮</div>
                    <h3>Game đã chơi</h3>
                    <p id="totalGames">0</p>
                </div>
                <div class="stat-card">
                    <div class="icon">📝</div>
                    <h3>Giao dịch</h3>
                    <p id="totalTransactions">0</p>
                </div>
            </div>

            <!-- Add Money -->
            <div class="card">
                <div class="card-header">
                    <h2><i class="fas fa-plus-circle"></i> Cấp tiền cho người chơi</h2>
                </div>
                <div class="card-body">
                    <form id="addMoneyForm" class="add-money-form">
                        <div class="form-group">
                            <label>User ID</label>
                            <input type="text" id="userId" placeholder="Nhập User ID" required>
                        </div>
                        <div class="form-group">
                            <label>Số tiền (MQ)</label>
                            <input type="number" id="amount" placeholder="0" required min="1">
                        </div>
                        <div class="form-group">
                            <label>Lý do</label>
                            <input type="text" id="reason" placeholder="Lý do">
                        </div>
                        <button type="submit" class="btn-primary">
                            <i class="fas fa-check"></i> Cấp tiền
                        </button>
                    </form>
                    <div id="addMoneyResult" class="result-message hidden"></div>
                </div>
            </div>

            <!-- Players List -->
            <div class="card">
                <div class="card-header">
                    <h2><i class="fas fa-users"></i> Danh sách người chơi</h2>
                    <div class="search-box">
                        <i class="fas fa-search"></i>
                        <input type="text" id="searchPlayer" placeholder="Tìm kiếm...">
                    </div>
                </div>
                <div class="card-body">
                    <div class="table-responsive">
                        <table>
                            <thead>
                                <tr>
                                    <th>User ID</th>
                                    <th>Số dư</th>
                                    <th>Game</th>
                                    <th>Thắng</th>
                                    <th>Thua</th>
                                    <th>Thao tác</th>
                                </tr>
                            </thead>
                            <tbody id="playersList">
                                <tr><td colspan="6" class="loading-text">Đang tải dữ liệu...</td></tr>
                            </tbody>
                        </table>
                    </div>
                </div>
            </div>
        </main>
    </div>

    <script>
        // ===== APP =====
        class DashboardApp {
            constructor() {
                this.init();
            }
            
            async init() {
                this.setupEventListeners();
                await this.loadData();
                this.updateClock();
                setInterval(() => this.updateClock(), 1000);
                // Auto refresh mỗi 30 giây
                setInterval(() => this.loadData(), 30000);
            }
            
            setupEventListeners() {
                document.getElementById('addMoneyForm').addEventListener('submit', async (e) => {
                    e.preventDefault();
                    await this.handleAddMoney();
                });
                
                document.getElementById('searchPlayer').addEventListener('input', (e) => {
                    this.filterPlayers(e.target.value);
                });
            }
            
            async loadData() {
                try {
                    const [stats, players] = await Promise.all([
                        this.fetchStats(),
                        this.fetchPlayers()
                    ]);
                    
                    this.updateStats(stats);
                    this.renderPlayers(players);
                } catch (error) {
                    console.error('Lỗi tải dữ liệu:', error);
                }
            }
            
            async fetchStats() {
                const response = await fetch('/api/stats');
                if (!response.ok) throw new Error('Failed to fetch stats');
                return response.json();
            }
            
            async fetchPlayers() {
                const response = await fetch('/api/players');
                if (!response.ok) throw new Error('Failed to fetch players');
                return response.json();
            }
            
            updateStats(stats) {
                document.getElementById('totalUsers').textContent = stats.totalUsers || 0;
                document.getElementById('totalBalance').textContent = 
                    `${(stats.totalBalance || 0).toLocaleString()} MQ`;
                document.getElementById('totalGames').textContent = stats.totalGames || 0;
                document.getElementById('totalTransactions').textContent = stats.totalTransactions || 0;
            }
            
            renderPlayers(players) {
                const tbody = document.getElementById('playersList');
                
                if (!players || players.length === 0) {
                    tbody.innerHTML = `
                        <tr><td colspan="6" style="text-align:center;padding:40px;color:#a0aec0;">
                            Chưa có người chơi nào
                        </td></tr>
                    `;
                    return;
                }
                
                tbody.innerHTML = players.map(player => `
                    <tr>
                        <td><code>${player.userId.slice(0, 8)}...</code></td>
                        <td><strong>${player.balance.toLocaleString()} MQ</strong></td>
                        <td>${player.gamesPlayed || 0}</td>
                        <td>${(player.totalWon || 0).toLocaleString()} MQ</td>
                        <td>${(player.totalLost || 0).toLocaleString()} MQ</td>
                        <td>
                            <button class="btn-small" onclick="app.quickAdd('${player.userId}')">
                                <i class="fas fa-plus"></i> Cấp
                            </button>
                        </td>
                    </tr>
                `).join('');
            }
            
            filterPlayers(searchTerm) {
                const rows = document.querySelectorAll('#playersList tr');
                const term = searchTerm.toLowerCase();
                rows.forEach(row => {
                    const text = row.textContent.toLowerCase();
                    row.style.display = text.includes(term) ? '' : 'none';
                });
            }
            
            async handleAddMoney() {
                const userId = document.getElementById('userId').value.trim();
                const amount = parseInt(document.getElementById('amount').value);
                const reason = document.getElementById('reason').value.trim() || 'Admin cấp tiền';
                const resultDiv = document.getElementById('addMoneyResult');
                
                if (!userId || !amount || amount <= 0) {
                    resultDiv.className = 'result-message error';
                    resultDiv.textContent = '⚠️ Vui lòng nhập đầy đủ thông tin';
                    resultDiv.classList.remove('hidden');
                    return;
                }
                
                try {
                    const response = await fetch('/api/add-money', {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({ userId, amount, reason })
                    });
                    
                    const data = await response.json();
                    if (data.success) {
                        resultDiv.className = 'result-message success';
                        resultDiv.textContent = `✅ Thành công! Đã cấp ${amount.toLocaleString()} MQ`;
                        resultDiv.classList.remove('hidden');
                        
                        document.getElementById('userId').value = '';
                        document.getElementById('amount').value = '';
                        document.getElementById('reason').value = '';
                        
                        setTimeout(() => this.loadData(), 1000);
                    } else {
                        resultDiv.className = 'result-message error';
                        resultDiv.textContent = `❌ ${data.error || 'Lỗi!'}`;
                        resultDiv.classList.remove('hidden');
                    }
                } catch (error) {
                    resultDiv.className = 'result-message error';
                    resultDiv.textContent = `❌ Lỗi kết nối!`;
                    resultDiv.classList.remove('hidden');
                }
            }
            
            quickAdd(userId) {
                document.getElementById('userId').value = userId;
                document.getElementById('amount').focus();
            }
            
            updateClock() {
                const now = new Date();
                document.getElementById('currentTime').textContent = 
                    now.toLocaleString('vi-VN', {
                        weekday: 'long',
                        day: '2-digit',
                        month: '2-digit',
                        year: 'numeric',
                        hour: '2-digit',
                        minute: '2-digit',
                        second: '2-digit'
                    });
            }
        }
        
        // Khởi tạo app
        let app;
        document.addEventListener('DOMContentLoaded', () => {
            app = new DashboardApp();
        });
    </script>
</body>
</html>
